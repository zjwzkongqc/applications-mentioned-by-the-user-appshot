name: Deploy free Supabase tennis backend

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Supabase Free project reference (20 lowercase letters)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tennis-supabase-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check and verify application
        run: npm run check && npm test
      - name: Build complete Edge Function
        run: npm run build:supabase
      - name: Initialize private schema and deploy function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TENNIS_PROJECT_REF: ${{ inputs.project_ref }}
        run: node scripts/deploy-supabase.mjs --project-ref "$TENNIS_PROJECT_REF"
