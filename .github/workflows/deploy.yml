name: Publish tennis club to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check source
        run: npm run check

      - name: Verify application behavior
        run: npm test

      - name: Build GitHub Pages application
        env:
          TENNIS_API_BASE_URL: ${{ vars.TENNIS_API_BASE_URL }}
          TENNIS_MIGRATION_FROM_ORIGIN: ${{ vars.TENNIS_MIGRATION_FROM_ORIGIN }}
          TENNIS_MIGRATION_ID: ${{ vars.TENNIS_MIGRATION_ID }}
        run: npm run build:pages:ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages application
        id: deployment
        uses: actions/deploy-pages@v4
