# Paid persistent hosting. Creating this Blueprint incurs Render charges.
# Keep GitHub Pages on its existing API until data import and receiver testing pass.
services:
  - type: web
    name: tennis-dazi-api-zjwzkongqc
    runtime: node
    plan: starter
    region: singapore
    repo: https://github.com/zjwzkongqc/applications-mentioned-by-the-user-appshot
    branch: main
    buildCommand: node scripts/build-node.mjs
    startCommand: node server/main.mjs
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    disk:
      name: tennis-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.x
      - key: DATA_DIR
        value: /var/data/tennis
      - key: MIGRATION_ID
        value: e0696cf3c60e5628bb7540da13909f02ea861e66f73ab90a1758d192cfa55d55
      - key: MIGRATION_FROM_ORIGIN
        value: https://tennis-dazi-club-2026.divine-seal-5110.chatgpt.site
      - key: MIGRATION_PAGE_BASE_URL
        value: https://zjwzkongqc.github.io/applications-mentioned-by-the-user-appshot/
      - key: MAINTENANCE_MODE
        value: '1'
